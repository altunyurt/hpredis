[project]
name = "hpredis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Özgür Altunyurt", email = "altunyurt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hpredis = "hpredis:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hpredis"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
hpredis = ["*.so"]

[dependency-groups]
dev = [
    "hiredis>=3.4.2",
    "ipython>=9.17.1",
    "mojo>=1.1.0",
    "numpy>=2.5.3",
    "pytest>=9.1.1",
    "redis>=8.1.0",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]
